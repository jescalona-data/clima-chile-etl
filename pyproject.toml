[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clima-etl"
version = "0.1.0"
description = "Pipeline ETL de clima para ciudades de Chile (Open-Meteo -> SQLite -> Google Sheets)"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "pyyaml",
    "gspread",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]